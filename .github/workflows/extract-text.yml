name: Extract text (Qwen3-VL)
# Reads the text in collector screenshots with Qwen3-VL running on the runner's CPU through llama.cpp.
# Screenshots come from a release of this repository (PNG/JPG files or ZIP exports from the app);
# without a release the samples in extraction/samples are used. Results are uploaded as an artifact.
on:
  push:
    branches: ['claude/**']
    paths: ['extraction/**', '.github/workflows/extract-text.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag with the screenshots (empty: newest release, drafts included)'
        default: ''
      models:
        description: 'Models to run: 2b, 4b or 2b,4b'
        default: '2b,4b'
      limit:
        description: 'Images per model, spread over the kinds of screen (0: all)'
        default: '10'
      max_width:
        description: 'Screenshots are scaled down to this width before reading'
        default: '1600'
concurrency:
  group: extract-text-${{ github.ref }}
  cancel-in-progress: true
permissions:
  # Draft releases are only visible with write access. The job reads; it pushes nothing.
  contents: write
env:
  LLAMA_CPP_TAG: b11564
  RELEASE: ${{ inputs.release }}
  MODELS: ${{ inputs.models || '2b,4b' }}
  LIMIT: ${{ inputs.limit || '10' }}
  MAX_WIDTH: ${{ inputs.max_width || '1600' }}
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Describe the runner CPU
        id: cpu
        # The build is tuned to the CPU it runs on, so the cache is kept per CPU model. Cache keys take no commas.
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo
          echo "id=$(grep -m1 'model name' /proc/cpuinfo | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "models=${MODELS//,/-}" >> "$GITHUB_OUTPUT"
      - name: Restore llama.cpp
        id: llama
        uses: actions/cache@v4
        with:
          path: llama-bin
          key: llama-cpp-${{ env.LLAMA_CPP_TAG }}-${{ steps.cpu.outputs.id }}
      - name: Build llama.cpp for the CPU
        if: steps.llama.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build llama.cpp/build -j"$(nproc)" --target llama-server
          mkdir -p llama-bin && cp llama.cpp/build/bin/llama-server llama-bin/
      - name: Restore models
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-vl-gguf-q4km-mmproj-q8-${{ steps.cpu.outputs.models }}
      - name: Download models
        # Official Qwen GGUF builds (Apache-2.0): Q4_K_M weights and the Q8_0 vision projector.
        run: |
          mkdir -p models
          for size in ${MODELS//,/ }; do
            S=${size^^}
            for file in "Qwen3VL-$S-Instruct-Q4_K_M.gguf" "mmproj-Qwen3VL-$S-Instruct-Q8_0.gguf"; do
              [ -s "models/$file" ] || curl -fsSL --retry 3 -o "models/$file" "https://huggingface.co/Qwen/Qwen3-VL-$S-Instruct-GGUF/resolve/main/$file"
            done
          done
          ls -la models
      - name: Get the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          # The release API lists drafts too, unlike gh release download.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20")
          if [ -n "$RELEASE" ]; then
            release=$(jq -c --arg t "$RELEASE" 'map(select(.tag_name == $t or .name == $t)) | .[0] // empty' <<<"$releases")
          else
            release=$(jq -c '.[0] // empty' <<<"$releases")
          fi
          if [ -n "$release" ]; then
            echo "Release: '$(jq -r '.name // .tag_name' <<<"$release")' (draft: $(jq -r .draft <<<"$release")), $(jq '.assets | length' <<<"$release") files:"
            jq -r '.assets[] | "  \(.name)  \(.size) bytes  \(.state)"' <<<"$release"
            # Files still uploading are listed with a state other than "uploaded".
            jq -r '.assets[] | select(.state == "uploaded") | [.id, .name] | @tsv' <<<"$release" | while IFS=$'\t' read -r id name; do
              case "${name,,}" in
                *.png|*.jpg|*.jpeg|*.webp|*.zip)
                  gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "input/$name" ;;
              esac
            done
            for zip in input/*.zip; do
              if [ -e "$zip" ]; then unzip -q -o "$zip" -d "${zip%.zip}"; rm "$zip"; fi
            done
          fi
          if [ -z "$(find input -type f | head -1)" ]; then
            echo "::warning::No screenshots in a release; reading extraction/samples instead"
            cp -r extraction/samples/. input/
          fi
          find input -type f | sort | head -50
          echo "$(find input -type f | wc -l) files"
      - name: Install Pillow and Tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil tesseract-ocr tesseract-ocr-vie > /dev/null
      - name: Read with Tesseract (baseline)
        run: python3 extraction/extract.py --engine tesseract --images input --out out/tesseract --label "Tesseract (vie)" --limit "$LIMIT" --max-width "$MAX_WIDTH"
      - name: Read with Qwen3-VL
        run: |
          mkdir -p out
          for size in ${MODELS//,/ }; do
            S=${size^^}
            ./llama-bin/llama-server -m "models/Qwen3VL-$S-Instruct-Q4_K_M.gguf" --mmproj "models/mmproj-Qwen3VL-$S-Instruct-Q8_0.gguf" \
              -c 8192 -t "$(nproc)" --port 8080 --no-webui > "out/server-$size.log" 2>&1 &
            server=$!
            for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health > /dev/null && break; sleep 2; done
            python3 extraction/extract.py --images input --out "out/qwen3-vl-$size" --label "Qwen3-VL $S (Q4_K_M, CPU)" --limit "$LIMIT" --max-width "$MAX_WIDTH" || true
            kill "$server" 2>/dev/null || true; wait "$server" || true
          done
      - name: Summary
        if: always()
        run: cat out/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extracted-text
          path: out
