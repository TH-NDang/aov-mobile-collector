name: Build APK
on:
  push:
    branches: [main, codex/chess-encyclopedia-collector, codex/chess-hero-row-capture-fix, codex/chess-verified-title-progress, codex/fix-statistics-warzone-filter, codex/pro-builds-compatible-upgrade, codex/fix-pro-short-list-scroll-proof]
  workflow_dispatch:
    inputs:
      metrics_probe:
        description: 'Collect bounded API30 rotation/rebind metrics only; no gestures or production verification'
        type: boolean
        default: false
concurrency:
  group: collector-build-${{ github.ref }}-${{ inputs.metrics_probe || false }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    if: ${{ !inputs.metrics_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Kotlin formatting
        run: ./tools/ktlint
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Restore fixed development signing key
        run: |
          base64 --decode debug-keystore.base64 > collector-debug.keystore
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
      # Regression guard: an APK missing the real launcher artwork or having a lower
      # versionCode than the previously installed build must never be offered as an update.
      - name: Verify upgrade metadata, original launcher icon and APK signing
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for APK in app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/app-arm64-v8a-debug.apk; do
            echo "Validating $APK"
            test -s "$APK"
            "$AAPT" dump badging "$APK" > /tmp/collector-badging.txt
            grep -q "package: name='vn.ndang.aovcollector' versionCode='52' versionName='0.13.21'" /tmp/collector-badging.txt
            grep -q "application-icon-" /tmp/collector-badging.txt
            grep -q "ic_launcher" /tmp/collector-badging.txt
            "$SIGNER" verify --print-certs "$APK"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: aov-mobile-collector-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: aov-mobile-collector-apk-arm64
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: UI and OCR smoke check
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-universal-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r chat-fixture/build/outputs/apk/debug/chat-fixture-debug.apk
            # This is a synthetic touch receiver, not the real game. Never install it on a user's device.
            adb install -r game-fixture/build/outputs/apk/debug/game-fixture-debug.apk
            # Tap the actual Home/Recents navigation buttons instead of bypassing them with global actions.
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.threebutton
            # UiSmoke enables the service itself once its process is up; enabling it here races the
            # process restart of am instrument and can leave the binding stuck.
            # Fail quickly on teaching regressions; retain its diagnostics before resetting this CI-only app.
            adb shell am instrument -w -e teaching_only true vn.ndang.aovcollector.test/vn.ndang.aovcollector.UiSmoke > teaching-smoke-result.txt
            cat teaching-smoke-result.txt
            mkdir -p teaching-smoke
            adb logcat -d -s AndroidRuntime > teaching-smoke/crash-log.txt
            adb exec-out run-as vn.ndang.aovcollector tar -C files/smoke -cf - . > teaching-smoke.tar
            tar -xf teaching-smoke.tar -C teaching-smoke
            grep -q TEACHING_SMOKE_OK teaching-smoke-result.txt
            # Disposable emulator only: clear focused-test state, then require the original full suite too.
            adb shell pm clear vn.ndang.aovcollector | grep -q Success
            adb shell am instrument -w vn.ndang.aovcollector.test/vn.ndang.aovcollector.UiSmoke > smoke-result.txt
            cat smoke-result.txt
            mkdir -p ui-smoke
            adb exec-out run-as vn.ndang.aovcollector tar -C files/smoke -cf - . > ui-smoke.tar
            tar -xf ui-smoke.tar -C ui-smoke
            adb logcat -d -s AndroidRuntime > ui-smoke/crash-log.txt
            cat ui-smoke/accessibility.txt
            grep -q SMOKE_OK smoke-result.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke
          path: |
            teaching-smoke
            teaching-smoke-result.txt
            ui-smoke
            smoke-result.txt

      - name: Publish verified v0.3.1 APK
        if: github.event.head_commit.message == 'Validate and release macro dropdown crash fix v0.3.1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-universal-debug.apk aov-mobile-collector-v0.3.1.apk
          gh release create v0.3.1 aov-mobile-collector-v0.3.1.apk --target "$RELEASE_COMMIT" --title 'AOV Collector v0.3.1' --notes 'Fix macro selection by expanding the searchable list inside the existing floating controller. Keeps the v0.3 signing key and saved collections. Built and checked with UI regression, OCR and Android lint.'


  edge-api34:
    if: ${{ !inputs.metrics_probe }}
    name: API 34 real external overlay regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Independent of the mandatory API30 job: unsupported synthetic window publication
    # must remain a visible failed result, not prevent the original full suite from running.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build the same collector and offline test fixtures
        run: |
          base64 --decode debug-keystore.base64 > collector-debug.keystore
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :chat-fixture:assembleDebug :game-fixture:assembleDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify real edge topology and injected input on the phone API level
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-universal-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r chat-fixture/build/outputs/apk/debug/chat-fixture-debug.apk
            # Synthetic external floating window. Permission is granted only on the
            # disposable emulator to this fixture app, never to AOV Collector.
            adb shell appops set com.openai.chatgpt SYSTEM_ALERT_WINDOW allow
            # Synthetic fixtures only. No actual game or account is used.
            adb install -r game-fixture/build/outputs/apk/debug/game-fixture-debug.apk
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.threebutton
            adb shell am instrument -w -e edge_only true vn.ndang.aovcollector.test/vn.ndang.aovcollector.UiSmoke > edge-smoke-result.txt
            cat edge-smoke-result.txt
            mkdir -p edge-smoke
            adb logcat -d -s AndroidRuntime > edge-smoke/crash-log.txt
            adb exec-out run-as vn.ndang.aovcollector tar -C files/smoke -cf - . > edge-smoke.tar
            tar -xf edge-smoke.tar -C edge-smoke
            grep -q EDGE_SMOKE_OK edge-smoke-result.txt
      - name: Report edge integration coverage explicitly
        if: always()
        run: |
          if grep -q EDGE_SMOKE_OK edge-smoke-result.txt 2>/dev/null; then
            echo 'API34 real foreign overlay integration passed: actual window identity, clear tap and blocked paths.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'API34 external overlay integration NOT VERIFIED. Job failed; no unsupported topology is counted as a pass. Inspect edge-smoke-api34 diagnostics. API30 original smoke and phone-geometry unit tests are separate results.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-smoke-api34
          path: |
            edge-smoke
            edge-smoke-result.txt

  metrics-probe:
    name: API 30 geometry diagnostics (no gestures)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.metrics_probe) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[metrics probe]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Kotlin formatting
        run: ./tools/ktlint
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build diagnostic instrumentation and offline fixture
        run: |
          base64 --decode debug-keystore.base64 > collector-debug.keystore
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :game-fixture:assembleDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Record one bounded landscape-rebind experiment
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-universal-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r game-fixture/build/outputs/apk/debug/game-fixture-debug.apk
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.threebutton
            adb shell am instrument -w -e metrics_probe true vn.ndang.aovcollector.test/vn.ndang.aovcollector.UiSmoke > metrics-probe-result.txt
            cat metrics-probe-result.txt
            mkdir -p metrics-probe
            adb logcat -d -s AndroidRuntime > metrics-probe/crash-log.txt
            adb exec-out run-as vn.ndang.aovcollector tar -C files/smoke -cf - . > metrics-probe.tar
            tar -xf metrics-probe.tar -C metrics-probe
            # This marker means the bounded evidence was recorded, not that geometry or input passed.
            grep -q METRICS_PROBE_RECORDED metrics-probe-result.txt
      - name: State diagnostic-only coverage
        if: always()
        run: |
          echo 'Diagnostic experiment only. This job injects no gestures and does not run or count normal API30/API34 regression gates; parallel normal jobs have separate results.' >> "$GITHUB_STEP_SUMMARY"
          grep METRICS_PROBE_RECORDED metrics-probe-result.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-probe-api30
          path: |
            metrics-probe
            metrics-probe-result.txt
