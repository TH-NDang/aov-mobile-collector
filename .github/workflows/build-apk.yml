name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: collector-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore fixed development signing key
        run: |
          mkdir -p ~/.android
          base64 --decode debug-keystore.base64 > ~/.android/debug.keystore
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aov-mobile-collector-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: UI and OCR smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure enabled_accessibility_services vn.ndang.aovcollector/.CollectorService
            adb shell settings put secure accessibility_enabled 1
            adb shell am instrument -w vn.ndang.aovcollector.test/vn.ndang.aovcollector.UiSmoke > smoke-result.txt
            cat smoke-result.txt
            adb pull /sdcard/Android/data/vn.ndang.aovcollector/files/smoke ui-smoke || true
            grep -q SMOKE_OK smoke-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: |
            ui-smoke
            smoke-result.txt
